<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GeoIntellis | AI-enabled Archtecture for Geohazard Mangement</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #0a0f1c; /* 深海蓝背景 */
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            text-align: center;
        }
        h1 {
            font-size: 3.5rem;
            letter-spacing: 2px;
            margin-bottom: 0.5rem;
            background: linear-gradient(90deg, #00C9FF 0%, #92FE9D 100%); /* 渐变色文字 */
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        p {
            font-size: 1.2rem;
            color: #8892b0;
            max-width: 600px;
            line-height: 1.6;
        }
        .contact-btn {
            margin-top: 2rem;
            padding: 12px 30px;
            border: 1px solid #00C9FF;
            color: #00C9FF;
            text-decoration: none;
            border-radius: 5px;
            transition: all 0.3s ease;
        }
        .contact-btn:hover {
            background-color: #00C9FF;
            color: #0a0f1c;
            box-shadow: 0 0 15px rgba(0, 201, 255, 0.5);
        }
    </style>

    <h1>GeoIntellis</h1>
