<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GeoIntellis | AI-enabled Architecture for Intelligent Geohazard Management</title>
    <style>
        /* 基础样式重置 */
        body {
            margin: 0;
            padding: 0;
            background-color: #050a14; /* 更深邃的背景 */
            color: #ffffff;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            overflow: hidden; /* 防止出现滚动条 */
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        /* 背景画布 */
        #canvas-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1; /* 放在最底层 */
        }

        /* 内容容器 */
        .content {
            text-align: center;
            z-index: 10; /* 确保内容在画布之上 */
            padding: 20px;
            backdrop-filter: blur(2px); /* 轻微磨砂玻璃效果 */
            border-radius: 20px;
        }

        h1 {
            font-size: 4rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
            /* 科技感蓝绿渐变 */
            background: linear-gradient(135deg, #00C9FF 0%, #92FE9D 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -2px;
            opacity: 0;
            animation: fadeIn 1.5s ease-out forwards;
        }

        /* 打字机效果的光标 */
        .typewriter {
            font-size: 1.5rem;
            color: #8892b0;
            font-family: 'Courier New', monospace; /* 代码字体 */
            min-height: 1.5em;
        }
        
        .cursor {
            display: inline-block;
            width: 10px;
            background-color: #00C9FF;
            animation: blink 1s infinite;
        }

        .contact-btn {
            margin-top: 3rem;
            display: inline-block;
            padding: 12px 35px;
            border: 1px solid rgba(0, 201, 255, 0.3);
            background: rgba(0, 201, 255, 0.05);
            color: #00C9FF;
            text-decoration: none;
            border-radius: 30px;
            font-size: 1rem;
            letter-spacing: 1px;
            transition: all 0.3s ease;
            opacity: 0;
            animation: fadeIn 1.5s ease-out 2s forwards; /* 延迟出现 */
        }

        .contact-btn:hover {
            background: rgba(0, 201, 255, 0.2);
            border-color: #00C9FF;
            box-shadow: 0 0 20px rgba(0, 201, 255, 0.4);
            transform: translateY(-2px);
        }

        /* 动画定义 */
        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* 移动端适配 */
        @media (max-width: 768px) {
            h1 { font-size: 2.5rem; }
            .typewriter { font-size: 1rem; }
        }
    </style>
</head>
<body>

    <canvas id="canvas-bg"></canvas>

    <div class="content">
        <h1>GeoIntellis</h1>
        <div class="typewriter">
            <span id="text"></span><span class="cursor">&nbsp;</span>
        </div>
        <a href="mailto:ruiyu.liang@unsw.edu.au" class="contact-btn">GET IN TOUCH</a>
    </div>

    <script>
        // --- 1. 打字机效果脚本 ---
        const textElement = document.getElementById('text');
        const textToType = "Redefining Geospatial Intelligence.";
        let charIndex = 0;

        function typeWriter() {
            if (charIndex < textToType.length) {
                textElement.textContent += textToType.charAt(charIndex);
                charIndex++;
                setTimeout(typeWriter, 50); // 打字速度
            }
        }
        // 延迟1秒开始打字
        setTimeout(typeWriter, 1000);


        // --- 2. 粒子网络背景脚本 ---
        const canvas = document.getElementById('canvas-bg');
        const ctx = canvas.getContext('2d');
        
        let particlesArray;

        // 设置画布大小
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        // 处理鼠标交互
        let mouse = {
            x: null,
            y: null,
            radius: (canvas.height/80) * (canvas.width/80)
        }

        window.addEventListener('mousemove', (event) => {
            mouse.x = event.x;
            mouse.y = event.y;
        });

        // 粒子类
        class Particle {
            constructor(x, y, directionX, directionY, size, color) {
                this.x = x;
                this.y = y;
                this.directionX = directionX;
                this.directionY = directionY;
                this.size = size;
                this.color = color;
            }
            // 绘制单个粒子
            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2, false);
                ctx.fillStyle = '#00C9FF'; // 粒子颜色
                ctx.fill();
            }
            // 更新粒子位置
            update() {
                // 边界检测（碰到屏幕边缘反弹）
                if (this.x > canvas.width || this.x < 0) {
                    this.directionX = -this.directionX;
                }
                if (this.y > canvas.height || this.y < 0) {
                    this.directionY = -this.directionY;
                }

                // 鼠标交互：当鼠标靠近时，粒子会被轻微推开或吸引
                let dx = mouse.x - this.x;
                let dy = mouse.y - this.y;
                let distance = Math.sqrt(dx*dx + dy*dy);
                
                // 这里我们做一个"网络连接"效果，鼠标附近粒子连线更多
                // 所以不需要强烈的排斥，保持自然运动即可
                
                this.x += this.directionX;
                this.y += this.directionY;
                this.draw();
            }
        }

        // 初始化粒子群
        function init() {
            particlesArray = [];
            // 粒子数量：根据屏幕大小决定，太多会卡
            let numberOfParticles = (canvas.height * canvas.width) / 9000;
            
            for (let i = 0; i < numberOfParticles; i++) {
                let size = (Math.random() * 2) + 1;
                let x = (Math.random() * ((innerWidth - size * 2) - (size * 2)) + size * 2);
                let y = (Math.random() * ((innerHeight - size * 2) - (size * 2)) + size * 2);
                let directionX = (Math.random() * 2) - 1; // 随机速度 -1 到 1
                let directionY = (Math.random() * 2) - 1;
                let color = '#00C9FF';

                particlesArray.push(new Particle(x, y, directionX, directionY, size, color));
            }
        }

        // 连接粒子的线条（核心效果）
        function connect() {
            let opacityValue = 1;
            for (let a = 0; a < particlesArray.length; a++) {
                for (let b = a; b < particlesArray.length; b++) {
                    let distance = ((particlesArray[a].x - particlesArray[b].x) * (particlesArray[a].x - particlesArray[b].x)) + 
                                   ((particlesArray[a].y - particlesArray[b].y) * (particlesArray[a].y - particlesArray[b].y));
                    
                    // 如果两个粒子距离够近，就画线
                    if (distance < (canvas.width/7) * (canvas.height/7)) {
                        opacityValue = 1 - (distance/20000);
                        ctx.strokeStyle = 'rgba(0, 201, 255,' + opacityValue + ')'; // 线条颜色
                        ctx.lineWidth = 1;
                        ctx.beginPath();
                        ctx.moveTo(particlesArray[a].x, particlesArray[a].y);
                        ctx.lineTo(particlesArray[b].x, particlesArray[b].y);
                        ctx.stroke();
                    }
                }
            }
        }

        // 动画循环
        function animate() {
            requestAnimationFrame(animate);
            ctx.clearRect(0, 0, innerWidth, innerHeight); // 清空画布
            
            for (let i = 0; i < particlesArray.length; i++) {
                particlesArray[i].update();
            }
            connect();
        }

        // 窗口大小改变时重置
        window.addEventListener('resize', () => {
            canvas.width = innerWidth;
            canvas.height = innerHeight;
            mouse.radius = ((canvas.height/80) * (canvas.height/80));
            init();
        });

        // 鼠标移出窗口时清除坐标
        window.addEventListener('mouseout', () => {
            mouse.x = undefined;
            mouse.y = undefined;
        });

        init();
        animate();
    </script>
</body>
</html>
